# Copy to preferences.yaml (gitignored) and edit. Hebrew and English both work everywhere.

# Role types to search for. tier: 1 = core, 2 = good, 3 = fallback (affects ranking).
# queries: searched on every site (Hebrew + English). titleKeywords: a job title must contain one of these
# (whole words, case-insensitive) to count as this role type. Set enabled: false to pause a role type.
# These are generic examples: edit them in the setup wizard or on the Preferences screen.
roleTypes:
  # ---------- tier 1 ----------
  - id: fullstack
    label: Full Stack Developer
    tier: 1
    queries: [Full Stack Developer, מפתח Full Stack]
    titleKeywords: [full stack, fullstack, full-stack, פולסטאק, פול סטאק]
  - id: backend
    label: Backend Developer
    tier: 1
    queries: [Backend Developer, מפתח צד שרת]
    titleKeywords: [backend, back end, back-end, server side, צד שרת]
  - id: frontend
    label: Frontend Developer
    tier: 1
    queries: [Frontend Developer, מפתח צד לקוח]
    titleKeywords: [frontend, front end, front-end, client side, צד לקוח]
  - id: software
    label: Software Developer / Software Engineer
    tier: 1
    queries: [Software Developer, Software Engineer, מפתח תוכנה, מהנדס תוכנה]
    titleKeywords: [software developer, software engineer, xEngineer, developer, programmer, מפתח, מפתחת, מתכנת, מתכנתת, מהנדס תוכנה, מהנדסת תוכנה]
  - id: junior
    label: Junior Developer
    tier: 1
    searchOnly: true   # searched only; a job's tier comes from its real role type
    queries: [Junior Developer, ג'וניור]
    titleKeywords: [junior, jr, ג'וניור, entry level, ללא ניסיון]
  # ---------- tier 2 ----------
  - id: qa-automation
    label: QA Automation Engineer
    tier: 2
    queries: [QA Automation, מפתח אוטומציה]
    titleKeywords: [automation, אוטומציה, SDET, QA automation]
  - id: solutions-integration
    label: Solutions / Integration Engineer
    tier: 2
    # (replaces the former "implementation" role type)
    notes: >-
      Solutions / integration / implementation engineering, not pure development. Judge fit for the ROLE: APIs and
      integrations between systems, SQL and data, troubleshooting and debugging customer issues, configuring and rolling
      out a product, and working with analysts, customers and internal teams. Coding depth matters less; a candidate who
      builds and debugs API integrations and works well with people is a strong fit even without deep algorithms.
    queries: [Technical Solutions Engineer, Solutions Engineer, Integration Engineer, Implementation Engineer, API Integration Specialist, מהנדס אינטגרציה, מהנדס פתרונות, מיישם מערכות]
    titleKeywords: [solutions engineer, solution engineer, technical solutions, integration engineer, integrations engineer, integration specialist, API integration, integration, אינטגרציה, implementation engineer, implementation specialist, implementation, implementer, מהנדס אינטגרציה, מהנדסת אינטגרציה, מהנדס פתרונות, מהנדסת פתרונות, מהנדס/ת אינטגרציה, מהנדס/ת פתרונות, מיישם מערכות, מיישמת מערכות, מיישם/ת מערכות]
    # ranked on the role fit itself, not on how much of the work is coding
    devContentCap: false
  # ---------- tier 3 ----------
  - id: app-support
    label: Application / Production Support (technical, Tier 2/3)
    tier: 3
    # (replaces the former "support" role type: technical application / production support only)
    notes: >-
      Technical application / production support ONLY: investigating production incidents and application issues with
      logs, SQL, APIs and monitoring, Tier 2/3 escalations, on-call for production, working with developers on fixes.
      Never phone, chat, helpdesk, IT / computer support or first-line customer handling.
    queries: [Application Support, Application Support Engineer, Production Support, Production Support Engineer, Support Engineer, Tier 2 Support, Tier 3 Support, תמיכה אפליקטיבית]
    titleKeywords: [application support, application support engineer, production support, תמיכה אפליקטיבית, tier 2, tier 3, support engineer]
    # title OR description; "משמרות" is fine when the text is about on-call for production incidents
    excludeKeywords: [טלפוני, טלפונית, תמיכה טלפונית, מוקד, שיחות, מענה טלפוני, call center, phone, tier 1, helpdesk, help desk, IT support, מחשוב, טכנאי, טכנאית, שירות לקוחות, נציג, נציגה, נציג/ה, משמרות]
    excludeUnless:
      משמרות: [כוננות, כוננויות, on-call, on call, תקלות פרודקשן, תקלות ייצור, production incident, production incidents, incident management]
    # the scorer also flags phone / chat / first-line work → skipped "front-line support"
    skipFrontLineSupport: true
    # always to the review queue, whatever the rank
    neverAutoSubmit: true

  # ---------- opt-in (disabled until you enable them) ----------
  # While disabled they are not searched and do not remove any job (excludeTitlesWhenDisabled: false).
  - id: forward-deployed
    label: Forward Deployed / Customer Engineer (software)
    tier: 2
    enabled: false
    excludeTitlesWhenDisabled: false
    notes: >-
      Forward deployed / customer / field engineer for SOFTWARE: building and adapting the product at customer sites or
      for specific customers, integrations, scripts and APIs, debugging in the customer's environment, turning customer
      needs into working solutions. Hardware installation, telecom / electrical field technicians and pure sales are a
      poor fit.
    queries: [Forward Deployed Engineer, Customer Engineer, Field Engineer software, מהנדס לקוחות, מהנדס שטח תוכנה]
    titleKeywords: [forward deployed, FDE, customer engineer, field engineer, deployment engineer, מהנדס לקוחות, מהנדסת לקוחות, מהנדס שטח, מהנדסת שטח]
    devContentCap: false
  - id: platform-implementer
    label: Platform implementer / business automation (monday, Salesforce, Priority, n8n / Make / Zapier)
    tier: 3
    enabled: false
    excludeTitlesWhenDisabled: false
    notes: >-
      Implementing and automating business platforms: monday.com, Salesforce, Priority and similar; low-code / no-code
      automation with n8n, Make or Zapier; building business workflows and integrations, scripting and APIs, working with
      business users to model their processes. Judge platform / automation and integration fit, not algorithmic coding.
    queries: [מיישם monday, מיישם Salesforce, מיישם פריוריטי, monday.com Implementation, Salesforce Implementation, Low-code Developer, No-code Automation, n8n, Zapier, מפתח אוטומציות עסקיות, אוטומציות עסקיות]
    titleKeywords: [monday, monday.com, מאנדיי, Salesforce, סיילספורס, Priority, פריוריטי, low-code, low code, no-code, no code, n8n, Make.com, Zapier, אוטומציות עסקיות, אוטומציה עסקית, מיישם, מיישמת]
    devContentCap: false
  - id: analyst
    label: Systems / Technical Product Analyst (junior, technical)
    tier: 3
    enabled: false
    excludeTitlesWhenDisabled: false
    notes: >-
      Technical systems / business / product analysis: writing specifications and user stories, data flows and APIs,
      SQL, working between business users and developers, QA of what was specified. Technical analyst roles only; pure
      financial, marketing or data-science analyst roles are a poor fit.
    queries: [מנתח מערכות ג'וניור, מנתח מערכות, Technical Product Analyst, System Analyst, Business Analyst technical, מנתחת מערכות]
    titleKeywords: [מנתח מערכות, מנתחת מערכות, system analyst, systems analyst, technical analyst, technical product analyst, product analyst, business analyst, אנליסט מערכות]
    devContentCap: false
  - id: tech-writer
    label: Technical / API Writer, Developer Documentation
    tier: 3
    enabled: false
    excludeTitlesWhenDisabled: false
    notes: >-
      Technical writing for developers: API references, developer guides and tutorials, reading code and running the
      product to document it, working with engineers. Judge technical understanding and writing (English and Hebrew), not
      coding depth. Marketing copywriting is a poor fit.
    queries: [Technical Writer, API Writer, API Technical Writer, Developer Documentation, כותב טכני, כתיבה טכנית]
    titleKeywords: [technical writer, API writer, documentation, docs engineer, developer documentation, כותב טכני, כותבת טכנית, כתיבה טכנית]
    devContentCap: false
  - id: customer-success-tech
    label: Customer Success Engineer / Technical Account Manager
    tier: 3
    enabled: false
    excludeTitlesWhenDisabled: false
    notes: >-
      Technical customer success: onboarding customers onto a technical product, integrations and APIs, troubleshooting
      escalations, being the technical point of contact. Sales quotas and non-technical account management are a poor
      fit.
    queries: [Customer Success Engineer, Technical Account Manager, Technical Customer Success, מהנדס הצלחת לקוח]
    titleKeywords: [customer success engineer, technical customer success, technical account manager, TAM, הצלחת לקוח, הצלחת לקוחות]
    # "Manager" is a seniority word everywhere else; here it is the role's name
    allowSeniorityWords: [Technical Account Manager]
    devContentCap: false

# Jobs that REQUIRE more years than this are skipped (status skipped_experience).
maxRequiredYears: 5

# rank = score + experienceBoost + tierBoost + salaryBoost
ranking:
  experienceBoost:
    junior: 15     # junior / entry-level / ללא ניסיון / בוגרי קורס / סטודנטים / 0-1 years
    years2: 5
    years3: -10
    above3: -20
    unknown: 0
  tierBoost:
    tier1: 5
    tier2: 0
    tier3: -25
  # added when the posted monthly salary reaches the role type's floor (0 = off)
  salaryBoost: 0

# Salary — monthly gross ILS. Every value starts EMPTY: fill in your own (Preferences screen → Salary).
# Per value: a role type's own `salary:` wins, then its tier below, then `default`.
#   floor              minimum acceptable monthly gross; a job whose posted maximum is lower → skipped_salary.
#                      Empty = no salary filtering.
#   textAnswerNoRange  answer to a text salary question when the job posts no range
#                      (the default below is prefilled; edit it, or set one per tier / role type)
#   numericFallback    one number for number-only salary fields when the job posts no range
# With a posted range the answer is its upper half: "X–Y ₪ ברוטו", X = midpoint rounded up to 500 (raised to the floor if
# one is set), Y = posted maximum; a number-only field gets X. No range and nothing set → asked each time.
salary:
  default: { floor: null, textAnswerNoRange: "גמיש, בהתאם להיקף התפקיד ולתנאים. אשמח לדבר על כך בשיחה", numericFallback: null }
  tier1: { floor: null, textAnswerNoRange: null, numericFallback: null }
  tier2: { floor: null, textAnswerNoRange: null, numericFallback: null }
  tier3: { floor: null, textAnswerNoRange: null, numericFallback: null }

# Accepted job locations. A job passes if its location contains one of these
# (or matches remoteKeywords). Jobs with no location pass. Empty list = any location.
# Example: locations: [תל אביב, רמת גן, השרון]
locations: []

filters:
  # Extra title keywords (in addition to every enabled role type's titleKeywords).
  includeTitleKeywords: []
  # Whole words, case-insensitive ("Java" does not exclude "JavaScript").
  excludeTitleKeywords: [בודק ידני, manual QA, manual tester, מכירות, sales, embedded,
    נציג, נציגת, נציגי, נציג/ה, helpdesk, help desk, מחשוב, מוקד, call center, שירות לקוחות,
    הכשרה, קורס, הכשרה והשמה, מסלול הכשרה, הסבה, bootcamp, course, training program]
  # Seniority words in the title → skipped before any LLM call (whole words; list inflections, e.g. בכיר + בכירה).
  excludeSeniorityKeywords: [Senior, Sr, Lead, Team Lead, Tech Lead, Principal, Staff, Architect, Head of, Manager, Director, בכיר, בכירה, ראש צוות, ארכיטקט, מנהל פיתוח]
  excludeCompanies: []
  remoteKeywords: [מהבית, עבודה מהבית, remote, היברידי, hybrid, כל הארץ]

# Used by the scorer only until data/profile/profile.json exists.
# TRUE FACTS ONLY: skills, years, education, the kind of role you want.
candidateSummary: |
  (fill in) e.g. Full Stack developer, X years experience. Skills: ... Education: ... Looking for: ...

# CV names exactly as shown in the site's CV list. Chosen per job by language (see ENGLISH_CV_MAX_HEBREW_RATIO).
cv:
  he: ""
  en: ""

# JobMaster: the CV file names exactly as in your JobMaster account (same language rule; a missing name = that
# application fails, no fallback). shareContactDetails answers JobMaster's one-time question "expose your contact
# details to recruiters in the profile database?" (default no).
jobmaster:
  cv:
    he: ""
    en: ""
  shareContactDetails: false

# Jobnet: the CV files saved in your Jobnet account (exact names; same language rule; a missing name = that
# application fails). regions: the Jobnet regions that count as your area (e.g. [שרון, מרכז]) — their jobs are
# "location approximate" (Jobnet gives regions, not cities). Empty = match the region's sub-areas to your locations.
jobnet:
  cv:
    he: ""
    en: ""
  regions: []

# JobKarov: the CV files in your JobKarov account, by the name JobKarov STORED — the name its send form lists, which
# can differ from the file you uploaded (same language rule; a missing name = that application fails, no fallback).
# JobKarov searches use your locations as its city filter.
jobkarov:
  cv:
    he: ""
    en: ""
  # the most JobKarov pages one session loads (a Run & send, or one task on its own); discovery keeps 4 for applying
  maxPageLoads: 10

thresholds:
  autoSubmitMinScore: 80
  matchConfidence: 0.85

limits:
  maxPagesPerRun: 3
  dailyApplyLimit: 15
  companyCooldownDays: 30

# Deterministic answers, seeded into the answers bank (pending when empty). You can also answer in the dashboard.
standardAnswers:
  city: ""
  salaryExpectation: ""
  noticePeriod: ""
  availability: ""
  fullTime: true
  drivingLicense: ""
  shifts: ""
  weekends: ""
  relocation: ""
  hybridOk: ""
  applyConsent: ""
